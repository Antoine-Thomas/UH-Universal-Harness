ont-weight="700" fill="#284543" text-anchor="start">compositeur</text><text x="262" y="336" font-family="Cascadia Mono, Consolas, monospace" font-size="9" font-weight="400" fill="#5d7370" text-anchor="start">chips /tools  /web  /new  /clear  /help</text><text x="262" y="352" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="9" font-weight="400" fill="#5d7370" text-anchor="start">Écouter (synthèse vocale) · Envoyer</text><text x="262" y="368" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="9" font-weight="400" fill="#5d7370" text-anchor="start">pièce jointe</text><text x="342" y="368" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="8.8" font-weight="400" fill="#fdc502" text-anchor="start">○ Dicter · ○ caméra — prévus (lot 2)</text><text x="262" y="386" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="9" font-weight="400" fill="#0c9f93" text-anchor="start">Ctrl/Cmd-K : palette de commandes</text><rect x="718" y="88" width="218" height="372" rx="8" fill="#ffffff" stroke="#c3d6d3" stroke-width="1.3"/><text x="732" y="108" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#284543" text-anchor="start">Panneaux (détachement : lot 2)</text><text x="732" y="130" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="9.4" font-weight="400" fill="#5d7370" text-anchor="start">· Fournisseurs (API keys)</text><text x="732" y="147" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="9.4" font-weight="400" fill="#5d7370" text-anchor="start">· Modèles</text><text x="732" y="164" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="9.4" font-weight="400" fill="#5d7370" text-anchor="start">· Second brain UHB</text><text x="732" y="181" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="9.4" font-weight="400" fill="#5d7370" text-anchor="start">· Mémoire (wiki, RAG, SiYuan)</text><text x="732" y="198" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="9.4" font-weight="400" fill="#5d7370" text-anchor="start">· Décision (trace)</text><text x="732" y="215" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="9.4" font-weight="400" fill="#5d7370" text-anchor="start">· Télémétrie</text><text x="732" y="232" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="9.4" font-weight="400" fill="#5d7370" text-anchor="start">· Données / Connexions cloud</text><text x="732" y="249" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="9.4" font-weight="400" fill="#5d7370" text-anchor="start">· Outils · MCP</text><text x="732" y="266" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="9.4" font-weight="400" fill="#5d7370" text-anchor="start">· Infra (lecture seule)</text><text x="732" y="306" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="9.2" font-weight="400" fill="#5d7370" text-anchor="start">aujourd'hui : seul le panneau</text><text x="732" y="322" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="9.2" font-weight="400" fill="#5d7370" text-anchor="start">« Fournisseurs » peut flotter</text><text x="732" y="342" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="9.2" font-weight="400" fill="#fdc502" text-anchor="start">○ détacher · redocker · replier</text><text x="732" y="358" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="9.2" font-weight="400" fill="#fdc502" text-anchor="start">○ disposition versionnée + Réinitialiser</text><text x="732" y="372" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="9.2" font-weight="400" fill="#5d7370" text-anchor="start">thèmes clair / sombre</text><text x="732" y="384" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="9.2" font-weight="400" fill="#16a34a" text-anchor="start">contraste texte mesuré : 9,5:1 / 14,9:1</text><text x="732" y="400" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="9" font-weight="400" fill="#fdc502" text-anchor="start">bordure compositeur 4,4:1 (clair) → défaut suivi</text><text x="30" y="500" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#fdc502" text-anchor="start">FLUX UX DE SÉCURITÉ</text><rect x="30" y="512" width="140" height="84" rx="8" fill="#ffffff" stroke="#c3d6d3" stroke-width="1.3"/><text x="40" y="532" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#0c9f93" text-anchor="start">1. Jeton</text><text x="40" y="550" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="9" font-weight="400" fill="#5d7370" text-anchor="start">43 caractères</text><text x="40" y="562" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="9" font-weight="400" fill="#5d7370" text-anchor="start">$UH_HOME/web-token</text><text x="40" y="574" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="9" font-weight="400" fill="#5d7370" text-anchor="start">0600</text><line x1="170" y1="554" x2="186" y2="554" stroke="#0c9f93" stroke-width="1.6" marker-end="url(#arrow-teal)"/><rect x="186" y="512" width="140" height="84" rx="8" fill="#ffffff" stroke="#c3d6d3" stroke-width="1.3"/><text x="196" y="532" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#0c9f93" text-anchor="start">2. Cookie</text><text x="196" y="550" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="9" font-weight="400" fill="#5d7370" text-anchor="start">HttpOnly</text><text x="196" y="562" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="9" font-weight="400" fill="#5d7370" text-anchor="start">SameSite=Strict</text><text x="196" y="574" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="9" font-weight="400" fill="#5d7370" text-anchor="start">port-scoped</text><line x1="326" y1="554" x2="342" y2="554" stroke="#0c9f93" stroke-width="1.6" marker-end="url(#arrow-teal)"/><rect x="342" y="512" width="140" height="84" rx="8" fill="#ffffff" stroke="#0c9f93" stroke-width="1.3"/><text x="352" y="532" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#0c9f93" text-anchor="start">3. CSP</text><text x="352" y="550" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="9" font-weight="400" fill="#5d7370" text-anchor="start">default-src 'none'</text><text x="352" y="562" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="9" font-weight="400" fill="#5d7370" text-anchor="start">script-src 'self'</text><text x="352" y="574" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="9" font-weight="400" fill="#5d7370" text-anchor="start">aucun inline</text><line x1="482" y1="554" x2="498" y2="554" stroke="#0c9f93" stroke-width="1.6" marker-end="url(#arrow-teal)"/><rect x="498" y="512" width="140" height="84" rx="8" fill="#ffffff" stroke="#c3d6d3" stroke-width="1.3"/><text x="508" y="532" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#0c9f93" text-anchor="start">4. Fenêtre</text><text x="508" y="550" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="9" font-weight="400" fill="#5d7370" text-anchor="start">--app Edge/Chrome</text><text x="508" y="562" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="9" font-weight="400" fill="#5d7370" text-anchor="start">profil isolé</text><text x="508" y="574" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="9" font-weight="400" fill="#5d7370" text-anchor="start">$UH_HOME/web-app</text><line x1="638" y1="554" x2="654" y2="554" stroke="#0c9f93" stroke-width="1.6" marker-end="url(#arrow-teal)"/><rect x="654" y="512" width="140" height="84" rx="8" fill="#ffffff" stroke="#0c9f93" stroke-width="1.3"/><text x="664" y="532" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#0c9f93" text-anchor="start">5. Bail</text><text x="664" y="550" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="9" font-weight="400" fill="#5d7370" text-anchor="start">battement 10 s</text><text x="664" y="562" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="9" font-weight="400" fill="#5d7370" text-anchor="start">45 s visible</text><text x="664" y="574" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="9" font-weight="400" fill="#5d7370" text-anchor="start">300 s réduite</text><line x1="794" y1="554" x2="810" y2="554" stroke="#0c9f93" stroke-width="1.6" marker-end="url(#arrow-teal)"/><rect x="810" y="512" width="140" height="84" rx="8" fill="#ffffff" stroke="#c3d6d3" stroke-width="1.3"/><text x="820" y="532" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#0c9f93" text-anchor="start">6. Sortie</text><text x="820" y="550" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="9" font-weight="400" fill="#5d7370" text-anchor="start">UHB /shutdown</text><text x="820" y="562" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="9" font-weight="400" fill="#5d7370" text-anchor="start">puis os._exit(0)</text><text x="820" y="574" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="9" font-weight="400" fill="#5d7370" text-anchor="start">port libéré</text><rect x="30" y="610" width="920" height="74" rx="8" fill="#f6faf9" stroke="#c3d6d3" stroke-width="1.3"/><text x="46" y="632" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#284543" text-anchor="start">Ce que la fenêtre ne fait jamais</text><text x="46" y="652" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="9.6" font-weight="400" fill="#5d7370" text-anchor="start">· parler directement à UHB depuis le navigateur (tout passe par UH, le CSP reste 'self')</text><text x="46" y="668" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="9.6" font-weight="400" fill="#5d7370" text-anchor="start">· exécuter du code sans approbation par appel · afficher une capacité non mesurée · promettre « sandbox » au lieu de « dossier du run »</text><rect x="30" y="696" width="920" height="62" rx="8" fill="#ffffff" stroke="#c3d6d3" stroke-width="1.3" stroke-dasharray="4 3"/><text x="46" y="716" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#284543" text-anchor="start">Légende du dossier</text><rect x="46" y="724" width="150" height="20" rx="10" fill="#16a34a" fill-opacity="0.12" stroke="#16a34a" stroke-width="1"/><text x="56" y="738" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#16a34a" text-anchor="start">livré et prouvé</text><text x="186" y="738" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#16a34a" text-anchor="end">✔</text><rect x="210" y="724" width="140" height="20" rx="10" fill="#dc2626" fill-opacity="0.12" stroke="#dc2626" stroke-width="1"/><text x="220" y="738" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#dc2626" text-anchor="start">reste à faire</text><text x="340" y="738" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#dc2626" text-anchor="end">✘</text><text x="366" y="722" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="9.2" font-weight="400" fill="#5d7370" text-anchor="start">Chaque ligne de la feuille de route porte son jalon, sa PR ou son commit de preuve.</text><text x="366" y="738" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="9.2" font-weight="400" fill="#fdc502" text-anchor="start">○ = capacité prévue au lot 2, non mesurée : elle n'est pas présentée comme livrée.</text></svg>
