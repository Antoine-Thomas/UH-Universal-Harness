[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "uh-harness"
version = "1.0.0"
description = "Universal Harness: a provider-agnostic agent harness with a local-first CLI, tool use and an optional web UI"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thomas Leroyer" }]
keywords = ["agent", "harness", "llm", "ollama", "cli", "local-first"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Terminals",
]
dependencies = [
    "httpx>=0.27",
    # tomllib is stdlib from 3.11; on 3.10 the backport is pulled automatically.
    'tomli>=2; python_version < "3.11"',
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "build>=1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
ui = ["rich>=13"]
web = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
uh = "uh.cli:main"

[project.urls]
Homepage = "https://github.com/Antoine-Thomas/UH-Universal-Harness"
Source = "https://github.com/Antoine-Thomas/UH-Universal-Harness"
Issues = "https://github.com/Antoine-Thomas/UH-Universal-Harness/issues"
Documentation = "https://github.com/Antoine-Thomas/UH-Universal-Harness/tree/main/docs"
Changelog = "https://github.com/Antoine-Thomas/UH-Universal-Harness/releases"

[tool.setuptools.packages.find]
include = ["uh*"]

[tool.setuptools.package-data]
"uh.web" = ["static/*"]
"uh.router" = ["catalog.toml"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
# Deliberately narrow and green: correctness rules only. E501 is not selected -
# line width is a formatter concern, and hand-enforcing it fights long prompt
# strings. Widen the selection (C4, UP, SIM) when the codebase is ready for it.
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.isort]
known-first-party = ["uh"]

[tool.mypy]
python_version = "3.10"
files = ["uh"]
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
exclude = ["^\\.venv/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
