# Hooks run on `git commit`. Install once with: pre-commit install
# Run on everything:  pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      - id: mypy
        files: ^uh/
        additional_dependencies:
          - "httpx>=0.27"
          - "fastapi>=0.110"
          - "uvicorn>=0.29"
        args: ["--config-file=pyproject.toml"]

  # A push is the last moment where a red commit is still cheap to stop: once it
  # is on main, CI runs on broken code and a tag could ship it.
  - repo: local
    hooks:
      - id: push-gate
        name: push gate (ruff, mypy, pytest)
        entry: python
        args: [scripts/push_gate.py]
        language: system
        pass_filenames: false
        stages: [pre-push]
