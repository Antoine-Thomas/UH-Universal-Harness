name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      - name: CLI smoke
        run: |
          uh --version
          uh --help
          uh doctor

  web:
    name: web / ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install with the web extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web,dev]"
          pip install playwright

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Web tests
        run: pytest -q tests/test_web.py

      - name: Web CLI smoke
        run: |
          uh web --help
          python -c "from uh.web.app import create_app; app = create_app(token='x'); print('app ok')"

  # The only job that has ever reproduced "the product breaks while every unit test
  # stays green": a real server, a real browser, two instances, a stale cookie.
  # Advisory on purpose - it joins the branch protection once it has ten consecutive
  # green runs. A flaky test is reported and fixed, never skipped.
  e2e:
    name: e2e / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Le plafond couvre l'installation (checkout, Python, dépendances, Chromium) PLUS la
    # suite, et il dépend de l'OS — c'est mesuré, pas supposé :
    #   * ubuntu-latest : suite complète en ~6 min pour 105 tests (CI du 24/11) ;
    #   * windows-latest : la même suite était encore à **61 % après 25 min 29 s**
    #     quand le plafond l'a coupée (PR #275). 25,5 / 0,61 -> ~42 min pour la suite
    #     entière sur ce runner, soit trois fois ce poste (105 tests en 14 min).
    # 60 minutes laissent ~1,4x de marge à Windows ; Linux garde 20 minutes, qui
    # suffisent largement et ne changent donc rien pour lui.
    # Ce n'est pas un délai de test allongé : c'est le budget du job. Les délais des
    # tests eux-mêmes (30 s, etc.) ne sont pas touchés.
    # `matrix` est autorisé dans `timeout-minutes` (référence des contextes GitHub).
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install with the web extra (Playwright is test-only)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web,dev]"
          pip install playwright

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end suite (excluded from the default run)
        # `--durations=20` : si Windows reste lent, le prochain run dit *quels*
        # fichiers coûtent le temps, au lieu de le deviner une deuxième fois.
        run: pytest -o addopts="" -m e2e -q --durations=20

      - name: Upload the turn journal on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: uh-web-log-${{ matrix.os }}
          path: |
            **/uh-web.log
            **/uh-web.log.*
          if-no-files-found: ignore
