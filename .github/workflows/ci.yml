name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      - name: CLI smoke
        run: |
          uh --version
          uh --help
          uh doctor

  web:
    name: web / ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install with the web extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web,dev]"
          pip install playwright

      - name: Install Playwright Browsers
        uses: microsoft/playwright-github-action@v1
        with:
          browsers: chromium

      - name: Web tests
        run: pytest -q tests/test_web.py

      - name: Web CLI smoke
        run: |
          uh web --help
          python -c "from uh.web.app import create_app; app = create_app(token='x'); print('app ok')"

  # The only job that has ever reproduced "the product breaks while every unit test
  # stays green": a real server, a real browser, two instances, a stale cookie.
  # Advisory on purpose - it joins the branch protection once it has ten consecutive
  # green runs. A flaky test is reported and fixed, never skipped.
  e2e:
    name: e2e / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install with the web extra (Playwright is test-only)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web,dev]"
          pip install playwright

      - name: Install Playwright Browsers
        uses: microsoft/playwright-github-action@v1
        with:
          browsers: chromium

      - name: End-to-end suite (excluded from the default run)
        run: pytest -o addopts="" -m e2e -q

      - name: Upload the turn journal on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: uh-web-log-${{ matrix.os }}
          path: |
            **/uh-web.log
            **/uh-web.log.*
          if-no-files-found: ignore
