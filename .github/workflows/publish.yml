name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build-and-publish-testpypi:
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build package
        run: |
          python -m pip install --upgrade build
          python -m build

      # --- ÉTAPE TEST (TestPyPI) ---
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # --- ÉTAPE PRODUCTION (PyPI) ---
  # Un job ne peut porter qu'un seul environnement : celui-ci est donc séparé.
  # Mêmes étapes, environnement `pypi`, aucun jeton (identité OIDC).
  build-and-publish-pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build package
        run: |
          python -m pip install --upgrade build
          python -m build

      # --- ÉTAPE PRODUCTION (PyPI) ---
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
