name: Publish to PyPI

# Fires ONLY when a GitHub release is published. Pushing a tag does nothing:
# the tag/release distinction is the single most common source of "I pushed and
# nothing happened".
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: tests (gate)
    runs-on: ubuntu-latest
    # The e2e suite lives in the same job on purpose: publishing is irreversible
    # (PyPI never lets a version be replaced), so the tests that actually caught the
    # product breaking - a real server, a real browser, two instances, a stale
    # cookie - must be part of the gate and not a separate advisory job.
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web]"
          pip install "playwright>=1.64.1"

      - name: Browser with system libraries
        run: |
          # GitHub migre ubuntu-latest vers Ubuntu 26.04.
          # Playwright < 1.64.1 ne supporte pas encore cette plateforme.
          # On force les binaires Ubuntu 24.04 (compatibles) pour éviter
          # l'erreur "Playwright does not support chromium on ubuntu26.04-x64".
          export PLAYWRIGHT_HOST_PLATFORM_OVERRIDE=ubuntu24.04-x64
          python -m playwright install --with-deps chromium

      - name: Test
        run: pytest -q

      - name: End-to-end suite (excluded from the default run)
        run: pytest -o addopts="" -m e2e -q

  build-and-publish-testpypi:
    name: build + TestPyPI
    needs: test
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check version against the release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import sys
          import tomllib

          version = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]

          sys.path.insert(0, ".")
          import uh  # noqa: E402  (the package under this checkout)

          tag = (os.environ.get("RELEASE_TAG") or "").strip()
          expected = tag[1:] if tag.startswith("v") else tag
          print(f"release tag: {tag!r} -> {expected!r}")
          print(f"pyproject version: {version}")
          print(f"uh.__version__: {uh.__version__}")

          problems = []
          if not expected:
              problems.append("no release tag in the event payload")
          if expected != version:
              problems.append(f"release tag {expected} != pyproject version {version}")
          if uh.__version__ != version:
              problems.append(f"uh.__version__ {uh.__version__} != pyproject version {version}")
          for problem in problems:
              print(f"::error::{problem}")
          if problems:
              sys.exit(1)
          print("version check OK")
          PY

      - name: Build package
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Twine check
        run: python -m twine check dist/*

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  build-and-publish-pypi:
    name: build + PyPI
    needs: [test, build-and-publish-testpypi]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check version against the release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import sys
          import tomllib

          version = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]

          sys.path.insert(0, ".")
          import uh  # noqa: E402  (the package under this checkout)

          tag = (os.environ.get("RELEASE_TAG") or "").strip()
          expected = tag[1:] if tag.startswith("v") else tag
          print(f"release tag: {tag!r} -> {expected!r}")
          print(f"pyproject version: {version}")
          print(f"uh.__version__: {uh.__version__}")

          problems = []
          if not expected:
              problems.append("no release tag in the event payload")
          if expected != version:
              problems.append(f"release tag {expected} != pyproject version {version}")
          if uh.__version__ != version:
              problems.append(f"uh.__version__ {uh.__version__} != pyproject version {version}")
          for problem in problems:
              print(f"::error::{problem}")
          if problems:
              sys.exit(1)
          print("version check OK")
          PY

      - name: Build package
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Twine check
        run: python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
