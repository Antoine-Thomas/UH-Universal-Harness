<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UH — Universal Harness</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<script src="/static/dreams.js" defer></script>
  <!-- First paint: the mark pulses while the shell wires itself and the first API
       calls land, then app.js fades it out. Static markup, no inline script, no
       inline style (the CSP allows neither), and no click to dismiss it. -->
  <div id="splash" class="splash" role="status" aria-live="polite" aria-label="Loading Universal Harness">
    <div class="splash-mark">UH</div>
    <div class="splash-word">Universal Harness</div>
    <div class="splash-track"><span></span></div>
  </div>
  <div class="layout" id="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <span class="brand">UH</span>
        <button id="new-session" class="icon-button" title="New session" aria-label="New session">+</button>
      </div>
      <input id="search" class="search" type="search" placeholder="Search messages…" autocomplete="off">
      <div class="folder-bar">
        <button id="new-folder" class="ghost-button" title="Name a folder, then file sessions into it">+ Folder</button>
        <span id="folder-hint" class="panel-hint"></span>
      </div>
      <ul id="session-list" class="session-list"></ul>
      <div id="search-results" class="search-results" hidden></div>
      <footer class="sidebar-foot">
        <span id="status-provider">…</span>
        <button id="providers-open" class="icon-button" title="Providers" aria-label="Providers">⚙</button>
        <button id="theme-toggle" class="icon-button" title="Toggle theme" aria-label="Toggle theme">◐</button>
      </footer>
    </aside>

    <div class="splitter" id="splitter-left" role="separator" aria-orientation="vertical"
         tabindex="0" aria-label="Resize the sessions column" title="Drag to resize · double-click to reset"></div>

    <main class="main">
      <header class="topbar">
        <button id="menu-toggle" class="icon-button" title="Sessions" aria-label="Sessions">☰</button>
        <button id="sidebar-toggle" class="icon-button" title="Hide the sessions column" aria-label="Hide sessions">«</button>
        <div class="title" id="session-title">No session</div>
        <select id="model-select" class="model-select" aria-label="Model"></select>
        <div class="gauge" title="Context estimate (characters / 4)">
          <div class="gauge-fill" id="gauge-fill"></div>
          <span id="gauge-label">ctx ~0 tok</span>
        </div>
        <button id="panel-toggle" class="icon-button" title="Configuration" aria-label="Configuration">⚙</button>
        <button id="stop" class="stop" disabled>Stop</button>
      </header>

      <div id="remote-banner" class="warning remote" hidden></div>

      <div id="terminal-warning" class="warning" hidden>
        Terminal toolset is ENABLED: the model can run shell commands in the workspace.
      </div>

      <section id="messages" class="messages" aria-live="polite"></section>

      <div id="command-chips" class="command-chips" role="toolbar" aria-label="Commands"></div>

      <div id="attachments" class="attachments" aria-live="polite"></div>

      <form id="composer" class="composer">
        <button type="button" id="attach" class="icon-button" title="Attach files" aria-label="Attach files">📎</button>
        <input id="files" class="visually-hidden" type="file" multiple
               accept=".txt,.md,.markdown,.csv,.json,.yaml,.yml,.toml,.log,.py,.js,.ts,.html,.css,.sh,.ps1,.pdf,.png,.jpg,.jpeg,.webp,.gif,.mp4,.mov,.webm,.mkv">
        <textarea id="input" rows="1" placeholder="Ask UH…  (Ctrl/Cmd-K for commands · drop a file here)" autocomplete="off"></textarea>
        <button type="submit" id="send">Send</button>
      </form>
    </main>

    <div class="splitter" id="splitter-right" role="separator" aria-orientation="vertical"
         tabindex="0" aria-label="Resize the configuration column" title="Drag to resize · double-click to reset"></div>

    <aside class="rightbar" id="providers-panel" aria-label="Configuration">
      <header class="panel-head">
        <strong>Configuration</strong>
        <span id="providers-hint" class="panel-hint"></span>
        <button id="providers-close" class="icon-button" aria-label="Close">×</button>
      </header>
      <nav class="panel-tabs" role="tablist">
        <button id="tab-keys" class="panel-tab active" role="tab" aria-selected="true" aria-controls="keys-view">API keys</button>
        <button id="tab-providers" class="panel-tab" role="tab" aria-selected="false" aria-controls="providers-view">Providers</button>
        <button id="tab-models" class="panel-tab" role="tab" aria-selected="false" aria-controls="models-view">Models</button>
        <button id="tab-uhb" class="panel-tab" role="tab" aria-selected="false" aria-controls="uhb-view">Second brain</button>
        <button id="tab-memory" class="panel-tab" role="tab" aria-selected="false" aria-controls="memory-view">Memory</button>
        <button id="tab-decision" class="panel-tab" role="tab" aria-selected="false" aria-controls="decision-view">Decision</button>
      </nav>
      <div class="rightbar-scroll">
        <div id="keys-view" class="panel-view" role="tabpanel" aria-labelledby="tab-keys">
          <div id="keys-priority" class="keys-priority"></div>
        </div>
        <div id="providers-view" class="panel-view" role="tabpanel" aria-labelledby="tab-providers" hidden>
          <div id="router-settings" class="router-settings"></div>
          <div id="providers-list" class="providers-list"></div>
        </div>
        <div id="models-view" class="panel-view" role="tabpanel" aria-labelledby="tab-models" hidden>
          <div id="hardware-card" class="hardware-card"></div>
        </div>
        <div id="uhb-view" class="panel-view" role="tabpanel" aria-labelledby="tab-uhb" hidden>
          <div id="uhb-panel" class="uhb-panel"></div>
        </div>
        <div id="memory-view" class="panel-view" role="tabpanel" aria-labelledby="tab-memory" hidden>
          <div id="memory-panel" class="memory-panel"></div>
        </div>
        <div id="decision-view" class="panel-view" role="tabpanel" aria-labelledby="tab-decision" hidden>
          <div id="decision-panel" class="decision-panel"></div>
        </div>
      </div>
    </aside>
  </div>

  <div id="palette" class="palette" hidden>
    <input id="palette-input" placeholder="Command…" autocomplete="off">
    <ul id="palette-list"></ul>
  </div>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
